[project]
name = "browser-agent"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    # >=1.40: 代码依赖 connect_over_cdp 与 --headless=new
    "playwright>=1.40",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["browser_agent*"]
