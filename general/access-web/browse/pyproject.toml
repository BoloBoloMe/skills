[project]
name = "browser-agent"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    # >=1.40: 代码依赖 connect_over_cdp 与 --headless=new
    "playwright>=1.40",
]

[project.optional-dependencies]
test = [
    "pytest",
]

# 虚拟项目: 不安装自身 (源码经 cwd / PYTHONPATH 导入), uv 只管依赖 venv.
# 容器内 skill 树是只读挂载, 可编辑安装需要向源码树写 egg-info, 会被拦.
[tool.uv]
package = false
