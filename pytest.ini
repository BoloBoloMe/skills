[pytest]
; testpaths 顺序有讲究: 各树 conftest.py 同名, pytest 启动按此顺序预载,
; 后者覆盖 sys.modules['conftest']. tests/ 必须最后 (其下大量
; `from conftest import ...` 依赖顶层名 'conftest' 指向根 conftest).
; 其他树禁止显式 `from conftest import` — 共享工具放唯一命名模块
; (先例: workflow/navigate/tests/nav_helpers.py), 否则会拿错对象.
testpaths =
    workflow/navigate/tests
    general/present/tests
    tests
markers =
    e2e: 真实重外部资源用例 (真容器/真镜像构建/真 nft/netns), 慢层; 快层 = -m "not e2e" (见 tests/README.md)