current_assets_required_fields:
  - intake_summary
  - current_runbook
  - current_plan
  - tiny_inline_record
  - ledger
  - unit_summaries
  - verification_evidence
  - failure_forensics
  - completion_review
current_pointers_required_fields:
  - human_status
  - agent_directory
  - active_runbook_or_plan
  - latest_runbook_or_plan
  - latest_verification
  - latest_completion_review
asset_registry_required_fields:
  - asset_ref
  - path
  - human_view
  - agent_view
  - lifecycle_state
  - record_role
  - version
  - owner_skill
  - owner_protocol
  - created_at
  - last_state_change_at
fixed_human_commands:
  confirm_execution_runbook: "确认执行：确认执行 Runbook <path>"
  confirm_execution_plan: "确认执行：确认执行 Plan <path>"
file_scope_policy:
  reject_absolute_paths: true
  reject_parent_traversal: true
  enforce_workspace_realpath_boundary: true
  path_format: posix_relative
