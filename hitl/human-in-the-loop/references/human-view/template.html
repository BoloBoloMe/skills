function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}

function slug(v){return String(v||'item').replace(/[^a-zA-Z0-9_-]+/g,'_').replace(/^_+|_+$/g,'')||'item';}
function isObject(v){return v!==null&&typeof v==='object'&&!Array.isArray(v);}
function leafCount(v){if(Array.isArray(v))return v.reduce((n,x)=>n+leafCount(x),0);if(isObject(v))return Object.values(v).reduce((n,x)=>n+leafCount(x),0);return v===undefined?0:1;}

const VALUE_KEY_RE=/(^|_)(state|status|tier|role|mode|result|artifact|kind|type|risk|decision_type)(_|$)/i;
function labelize(key){const raw=String(key||'');if(KEY_LABELS[raw])return KEY_LABELS[raw];return raw.split(/[_\s-]+/).filter(Boolean).map(part=>TOKEN_LABELS[part.toLowerCase()]||part).join('');}
function enumLabel(value,key=''){const raw=String(value);const lower=raw.toLowerCase();if(ENUM_LABELS[raw])return ENUM_LABELS[raw];if(ENUM_LABELS[lower]&&(VALUE_KEY_RE.test(key)||/^(true|false)$/.test(lower)))return ENUM_LABELS[lower];return raw;}
function refLabel(ref,artifact=''){const raw=String(ref||'');const match=raw.match(/^([^/@]+)\/([^@]+)(@.+)?$/);if(!match)return enumLabel(artifact||raw,'artifact');const group=TOKEN_LABELS[match[1].toLowerCase()]||match[1];const stage=ENUM_LABELS[match[2].toLowerCase()]||labelize(match[2]);return `${group} / ${stage}${match[3]||''}`;}
function pill(key,value){if(value===undefined||value===null||value==='')return '';const shown=enumLabel(value,key);const t=tone(`${value} ${shown}`);return `<span class="pill ${t}"><span class="kvkey">${esc(labelize(key))}</span><span class="kvsep">·</span><span class="kvval">${esc(shown)}</span></span>`;}
function groupOf(asset){const ref=asset.asset_ref||'';if(['superseded','retired','failed','closed'].includes(asset.lifecycle_state))return '历史';if(ref.startsWith('planning/'))return '规划';if(ref.startsWith('checks/')||ref.startsWith('execution/'))return '执行';return '执行';}

function buildPages(){const manifest=payload.manifest||{};const assets=[...(payload.assets||[])].sort(assetCompare);const pages=[];for(const asset of assets){const commands=commandsForAsset(asset,manifest);const sections=contentSectionsForAsset(asset);if(commands.length)sections.unshift({title:'审批命令',value:commands,commands});const metaFields=[['asset_ref',asset.asset_ref],['artifact',asset.artifact],['schema_version',(asset.raw||{}).schema_version],['path',asset.path],['lifecycle_state',asset.lifecycle_state],['record_role',asset.record_role],['sha256',asset.sha256]];pages.push({id:slug(asset.asset_ref),group:groupOf(asset),title:refLabel(asset.asset_ref,asset.artifact),meta:[asset.asset_ref,enumLabel(asset.record_role,'record_role'),asset.path].filter(Boolean).join(' · '),metaFields,raw:asset.raw,badges:[['lifecycle_state',asset.lifecycle_state],['record_role',asset.record_role]],summary:'',sections,commands});}const wf=manifest.workflow||{};pages.push({id:'manifest',group:'系统清单',title:'Manifest / 系统清单',meta:'manifest',metaFields:[['protocol',payload.protocol],['schema_version',payload.schema_version],['generated_at',payload.generated_at],['tier',manifest.tier],['current_stage',wf.current_stage],['status',wf.status]],raw:manifest,badges:[['tier',manifest.tier],['current_stage',wf.current_stage],['status',wf.status]],summary:'',sections:[{title:'系统清单',value:manifest}],commands:[]});state.pages=pages;state.activeId=pages[0]?.id||'manifest';}
function contentSectionsForAsset(asset){const raw=asset.raw||{};const hidden=new Set(['asset_ref','artifact','schema_version']);const sections=[];for(const [key,value] of Object.entries(raw)){if(hidden.has(key))continue;sections.push({title:labelize(key),value});}return sections.length?sections:[{title:'正文内容',value:raw}];}
function assetCompare(a,b){const ar=stageRank(a.asset_ref,a.artifact),br=stageRank(b.asset_ref,b.artifact);return ar-br||String(a.asset_ref).localeCompare(String(b.asset_ref),'zh-CN');}
function stageRank(ref='',artifact=''){const key=`${ref} ${artifact}`.toLowerCase();const order=[['planning/facts',10],['requirements',10],['facts',10],['planning/design',20],['design',20],['planning/blueprint',30],['blueprint',30],['implementation-package',40],['checks/',50],['asset-check',50],['execution/plan',60],['execution/runbook',60],['execution/verification',70],['verification',70],['execution/close',80],['close',80]];const found=order.find(([needle])=>key.includes(needle));return found?found[1]:90;}
function commandsForAsset(asset,manifest){const active=(manifest.current_pointers||{}).active_agent_asset;const ref=String(asset.asset_ref||'');const path=String(asset.path||'');return (payload.suggested_commands||[]).filter(c=>{const cmd=String(c.command||'');return cmd.includes(ref)||(active===ref&&cmd.includes(ref));});}
function pageSearchText(page){return [page.group,page.title,page.meta,stableJson(page.raw)].join('\n').toLowerCase();}
function visiblePages(){const q=state.query.trim().toLowerCase();return q?state.pages.filter(p=>pageSearchText(p).includes(q)):state.pages;}

/** Constraint: nested objects stay traceable; deep branches collapse to keep review pages readable. */
function renderValue(value,key='',depth=0){if(value===null||value===undefined)return '<span class="nullish">空</span>';if(Array.isArray(value))return renderArray(value,key,depth);if(isObject(value))return renderObject(value,depth,key);if(typeof value==='boolean')return pill(key,String(value));if(typeof value==='number')return `<code>${esc(value)}</code>`;return renderString(value,key);}
function renderString(value,key){const text=String(value);if(key==='command'||key==='confirmation_command')return `<code>${esc(text)}</code>`;if(key==='asset_ref'||/^([^/@]+)\/([^@]+)(@.+)?$/.test(text))return `<code title="${esc(text)}">${esc(refLabel(text))}</code>`;if(VALUE_KEY_RE.test(key))return pill(key,text)||esc(enumLabel(text,key));const shown=enumLabel(text,key);if(/^https?:\/\//.test(text))return `<a href="${esc(text)}">${esc(shown)}</a>`;if(text.length<90&&/[\/@:_-]/.test(text))return `<code>${esc(shown)}</code>`;return esc(shown);}
function renderArray(items,key,depth){if(items.length===0)return '<div class="empty">[]</div>';const allPrimitive=items.every(x=>!isObject(x)&&!Array.isArray(x));if(allPrimitive)return `<ul class="primitiveList">${items.map(x=>`<li>${renderValue(x,key,depth+1)}</li>`).join('')}</ul>`;return `<div class="arrayList">${items.map((x,i)=>renderArrayItem(x,key,i,depth)).join('')}</div>`;}
function renderArrayItem(value,key,index,depth){if(isObject(value)||Array.isArray(value)){const title=isObject(value)?cardTitleFor(value,key,index):`${labelize(key)||'项目'} #${index+1}`;return `<details class="objectCard" open><summary><span class="cardTitle">${esc(title)}</span><span class="cardMeta">${leafCount(value)} 项</span></summary><div class="cardBody">${renderValue(value,key,depth+1)}</div></details>`;}return renderValue(value,key,depth+1);}
function cardTitleFor(value,key,index){if(value.command)return commandRuleTitle(value.command);return value.asset_ref||value.id||value.unit_id||value.path||`${labelize(key)||'项目'} #${index+1}`;}
function commandRuleTitle(command){const text=String(command||'');const file=(text.match(/(?:^|[\\/\s])([a-z_]+\.py)\b/)||[])[1]||'';const rules={'validate_manifest.py':'校验 manifest、资产登记表、当前指针与决策日志一致性','validate_planning_assets.py':'校验规划资产 schema、必填字段与实现包引用完整性','transform_human_view.py':'校验 human-view.html 与 manifest 中记录的 payload/html hash 无漂移','validate_asset_check.py':text.includes('--pre-approval')?'预批准门禁：校验引用哈希、蓝图执行契约、审批状态与人类视图':'最终资产门禁：校验批准状态、引用哈希、蓝图执行契约、工作区与人类视图','check_allowed_files.py':'校验计划/实际变更文件符合 allowed_files 与 prohibited_files 边界','validate_plan_or_runbook.py':'校验 Plan / Runbook 的仓库上下文、计划文件、验证计划与确认命令','write_verification_record.py':'写入验证记录并固化验证证据','run_self_tests.py':'运行 HITL 协议脚本回归自测','init_hitl_package.py':'初始化 HITL 资产包骨架'};return rules[file]||text;}
function renderObject(obj,depth,contextKey=''){const entries=Object.entries(obj);if(entries.length===0)return '<div class="empty">{}</div>';return `<div class="objectGrid depth-${Math.min(depth,4)}">${entries.map(([k,v])=>`<div class="field"><div class="fieldKey" title="${esc(k)}">${esc(labelize(k))}</div><div class="fieldValue">${renderValue(v,k,depth+1)}</div></div>`).join('')}</div>`;}
function renderCommands(commands){return commands.map(c=>`<div class="command"><code>${esc(c.command)}</code><button class="btn primary" type="button" data-copy="${esc(c.command)}">复制</button></div>`).join('');}
function sectionHtml(section){const body=section.commands?renderCommands(section.commands):renderValue(section.value,section.title,0);return `<section class="section"><div class="sectionHead"><h2>${esc(section.title)}</h2><span class="sectionMeta">${leafCount(section.value)} 项</span></div>${body}</section>`;}

function renderNav(){const root=qs('#navList');const shown=visiblePages();root.className='navList';root.innerHTML=`<div class="navMain">${renderNavStageGroups(shown)}</div><div class="navSystem">${renderNavSystemGroups(shown)}</div>`;qsa('.navitem',root).forEach(btn=>btn.addEventListener('click',()=>setActive(btn.dataset.pageId)));}
function renderNavStageGroups(pages){const groups=['规划','执行'].filter(group=>pages.some(p=>p.group===group));return groups.map((group,index)=>renderNavGroup(group,pages.filter(p=>p.group===group),{divider:index<groups.length-1&&group!=='规划'})).join('');}
function renderNavSystemGroups(pages){return ['系统清单','历史'].filter(group=>pages.some(p=>p.group===group)).map(group=>renderNavGroup(group,pages.filter(p=>p.group===group),{divider:false})).join('');}
function renderNavGroup(group,pages,{divider=true}={}){const body=pages.map((page,index)=>navItem(page,index,pages.length)).join('');const tail=divider?'<div class="navdivider"></div>':'';if(group==='历史'){const open=state.query||pages.some(p=>p.id===state.activeId)?' open':'';return `<details class="navHistory"${open}><summary>${esc(group)} · ${pages.length}</summary>${body}</details>${tail}`;}return `<div class="navgroup">${esc(group)}</div>${body}${tail}`;}
function navItem(page,index=0,total=1){const t=tone((page.badges.find(b=>b[0]==='lifecycle_state')||page.badges.find(b=>b[0]==='status')||[])[1]);const historical=page.group==='历史'?' history':'';const system=page.group==='系统清单'?' system':'';const style=navColorStyle(page.group,index,total);return `<button class="navitem${historical}${system} ${t?'tone-'+t:''} ${page.id===state.activeId?'active':''}" type="button" data-page-id="${esc(page.id)}" data-title="${esc(page.title)}"${style}><span class="dot"></span><span class="navcopy"><span class="navtitle">${esc(page.title)}</span><span class="navmeta">${esc(page.meta||page.group)}</span></span></button>`;}
function navColorStyle(group,index,total){const palettes={规划:['#155e75','#0e7490','#0284c7','#2563eb','#4f46e5'],执行:['#b45309','#d97706','#ea580c','#dc2626','#be123c']};if(group==='系统清单')return ' style="--dot-color:#111"';const colors=palettes[group];if(!colors)return '';const pos=total<=1?0:Math.round(index*(colors.length-1)/(total-1));return ` style="--dot-color:${colors[pos]}"`;}
function renderHeader(page){qs('#pageTitle').textContent=page.title;qs('#pageSub').textContent='';qs('#pageBadges').innerHTML=page.badges.map(([k,v])=>pill(k,v)).join('');renderHeaderMeta(page);}

function renderContent(page){qs('#content').innerHTML=page.sections.map(sectionHtml).join('');qsa('[data-copy]').forEach(btn=>btn.addEventListener('click',()=>copyText(btn.dataset.copy,'已复制固定命令')));}
function renderEmptySearch(){qs('#pageTitle').textContent='无匹配结果';qs('#pageSub').textContent='';qs('#pageBadges').innerHTML='';qs('#pageHeaderMeta').hidden=true;qs('#content').innerHTML=`<div class="emptySearchState"><p class="emptySearchTitle">没有找到匹配资产</p><span class="emptySearchQuery">${esc(state.query)}</span></div>`;}
function renderApp(){const shown=visiblePages();renderNav();if(!shown.length){renderEmptySearch();return;}if(!shown.some(p=>p.id===state.activeId))state.activeId=shown[0].id;const page=state.pages.find(p=>p.id===state.activeId)||shown[0];renderHeader(page);renderContent(page);qs('#rawPage').onclick=()=>openRaw(page.title,rawObjectForPage(page));}
function setActive(id){if(state.activeId===id)return;state.activeId=id;const c=qs('#content'),t=qs('#topFrame');c.classList.add('content-leave');t.classList.add('content-leave');setTimeout(()=>{renderApp();window.scrollTo({top:0,left:0,behavior:'auto'});c.classList.remove('content-leave');t.classList.remove('content-leave');c.classList.add('content-enter');requestAnimationFrame(()=>c.classList.add('content-enter-active'));setTimeout(()=>c.classList.remove('content-enter','content-enter-active'),460);qs('#main').focus({preventScroll:true});},120);}
function movePage(step){const shown=switchablePages();if(!shown.length)return;const idx=shown.findIndex(p=>p.id===state.activeId);const base=idx<0?(step>0?-1:0):idx;const next=shown[(base+step+shown.length)%shown.length];if(next)setActive(next.id);}

/** External protocol tradeoff: clipboard is best-effort because offline browsers may deny access. */
function copyText(text,okMessage='已复制'){if(!text)return;navigator.clipboard?.writeText(text).then(()=>toast(okMessage)).catch(()=>toast('浏览器拒绝复制，请手动复制'));}
function copyCurrentCommand(){const page=currentPage();const command=page?.commands?.[0]?.command;if(!command){toast('当前资产没有可复制命令');return;}copyText(command,'已复制当前资产命令');}
function toast(message){const el=qs('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),1800);}
function openRaw(title,obj){state.modalReturn=document.activeElement;qs('#rawJsonModalTitle').textContent=title;qs('#rawJsonModalCode').textContent=stableJson(obj);document.body.classList.add('modal-open');const modal=qs('#rawJsonModal');modal.hidden=false;requestAnimationFrame(()=>modal.classList.add('show'));qs('.modalPanel',modal).focus();}
function closeRaw(){const modal=qs('#rawJsonModal');modal.classList.remove('show');document.body.classList.remove('modal-open');setTimeout(()=>{modal.hidden=true;state.modalReturn?.focus?.();},160);}
function isEditableTarget(target){return target&&(['INPUT','TEXTAREA','SELECT'].includes(target.tagName)||target.isContentEditable);}
class SmoothKeyboardScrollService{constructor({speed=1200}={}){this.speed=speed;this.direction=0;this.rafId=null;this.lastTime=0;}setDirection(direction){const next=Math.max(-1,Math.min(1,Number(direction)||0));if(next===this.direction)return;this.direction=next;if(!this.direction){this.stopLoop();return;}if(!this.rafId){this.lastTime=0;this.rafId=requestAnimationFrame(time=>this.tick(time));}}tick(time){if(!this.direction){this.stopLoop();return;}if(!this.lastTime)this.lastTime=time;const deltaMs=Math.min(34,Math.max(0,time-this.lastTime));this.lastTime=time;this.scrollElement().scrollTop+=this.direction*this.speed*(deltaMs/1000);this.rafId=requestAnimationFrame(nextTime=>this.tick(nextTime));}scrollElement(){return document.scrollingElement||document.documentElement;}stopLoop(){if(this.rafId)cancelAnimationFrame(this.rafId);this.rafId=null;this.lastTime=0;}stop(){this.direction=0;this.stopLoop();}}
class KeyboardController{constructor({onPrevious,onNext,onCopyCommand,scrollService}){this.pressedKeys=new Set();this.scrollService=scrollService;window.addEventListener('keyup',event=>{const key=this.normalizeKey(event.key);this.pressedKeys.delete(key);if(key==='arrowup'||key==='arrowdown')this.syncScrollDirection();});window.addEventListener('blur',()=>{this.pressedKeys.clear();this.scrollService?.stop();});document.addEventListener('keydown',event=>{if(isEditableTarget(event.target))return;if(event.key==='Escape'&&!qs('#rawJsonModal').hidden){event.preventDefault();closeRaw();return;}const key=this.normalizeKey(event.key);const otherNonModifierPressed=Array.from(this.pressedKeys).some(pressedKey=>pressedKey!==key&&!this.isModifierKey(pressedKey));this.pressedKeys.add(key);if(key==='arrowup'||key==='arrowdown'){event.preventDefault();this.syncScrollDirection();return;}if(event.key==='ArrowLeft'){event.preventDefault();onPrevious();return;}if(event.key==='ArrowRight'){event.preventDefault();onNext();return;}if(this.shouldCopyCommand(event,key,otherNonModifierPressed)){event.preventDefault();onCopyCommand();}});}syncScrollDirection(){const up=this.pressedKeys.has('arrowup');const down=this.pressedKeys.has('arrowdown');const direction=up===down?0:(down?1:-1);this.scrollService?.setDirection(direction);}normalizeKey(key){return String(key||'').toLowerCase();}isModifierKey(key){return ['control','meta','alt','shift','altgraph'].includes(key);}shouldCopyCommand(event,key,otherNonModifierPressed){return key==='c'&&!event.repeat&&!event.ctrlKey&&!event.metaKey&&!event.altKey&&!event.shiftKey&&!otherNonModifierPressed;}}
function bindKeyboard(){const smoothScroll=new SmoothKeyboardScrollService({speed:900});new KeyboardController({onPrevious:()=>movePage(-1),onNext:()=>movePage(1),onCopyCommand:()=>copyCurrentCommand(),scrollService:smoothScroll});}
function bindEvents(){qs('#navToggle').addEventListener('click',event=>{const app=qs('#app');const open=app.classList.toggle('nav-open');event.currentTarget.setAttribute('aria-expanded',String(open));event.currentTarget.setAttribute('aria-label',open?'折叠侧边栏':'展开侧边栏');qs('.toggleText').textContent=open?'收起导航':'展开导航';});qs('#search').addEventListener('input',e=>{state.query=e.target.value;renderApp();});qs('#closeRawJson').addEventListener('click',closeRaw);qs('#rawJsonModal').addEventListener('click',e=>{if(e.target.id==='rawJsonModal')closeRaw();});bindKeyboard();}
buildPages();bindEvents();renderApp();
</script>
