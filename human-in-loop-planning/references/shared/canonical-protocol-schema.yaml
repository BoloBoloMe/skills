protocol: HILP
schema_version: "2.24.0"
protocol_version: "2.24.0"
mode_values:
  - preflight-scaffold
  - standard
  - strict
phase_map:
  phase-00: router
  phase-01: requirements-facts
  phase-02: design-choice
  phase-03: implementation-blueprint
  phase-04: reapproval
  phase-05: execution-handoff
  phase-06: archive-index
  phase-99: pressure-test
lifecycle_state_values:
  - draft
  - ready-for-review
  - approved
  - blocked
  - superseded
  - retired
  - closed-record
record_role_values:
  - working-asset
  - approval-record
  - reapproval-record
  - handoff-record
  - archive-index
role_state_matrix:
  working-asset:
    - draft
    - ready-for-review
    - blocked
    - superseded
    - retired
  approval-record:
    - approved
    - superseded
    - retired
  reapproval-record:
    - ready-for-review
    - approved
    - blocked
    - closed-record
    - superseded
    - retired
  handoff-record:
    - closed-record
    - superseded
    - retired
  archive-index:
    - closed-record
    - superseded
    - retired
owner_skill_values:
  - human-in-loop-planning
  - human-in-loop-execution
owner_protocol_values:
  - HILP
  - HILE
current_assets_required_fields:
  - requirements_facts
  - design_choice
  - implementation_blueprint
  - execution_handoff
  - reapproval_log
  - archive_index
  - audit_trail
current_pointers_required_fields:
  - human_review
  - agent_directory
  - latest_approved_design
  - latest_approved_blueprint
  - latest_handoff
asset_registry_required_fields:
  - asset_ref
  - path
  - human_view
  - agent_view
  - phase_id
  - lifecycle_state
  - record_role
  - version
  - owner_skill
  - owner_protocol
  - created_at
  - last_state_change_at
fixed_human_commands:
  approve_design: "批准设计：批准 phase-02/design-choice@vN"
  approve_blueprint: "批准蓝图：批准 phase-03/implementation-blueprint@vN"
  confirm_execution_runbook: "确认执行：确认执行 Runbook <path>"
  confirm_execution_plan: "确认执行：确认执行 Plan <path>"
  reapproval_reapprove: "批准重审：批准 phase-04/reapproval@vN"
  reapproval_revise_design: "批准重审：重做设计 phase-04/reapproval@vN"
  reapproval_revise_blueprint: "批准重审：重做蓝图 phase-04/reapproval@vN"
  reapproval_revise_handoff: "批准重审：重做交接 phase-04/reapproval@vN"
  reapproval_block_execution: "批准重审：阻断执行 phase-04/reapproval@vN"
  reapproval_no_change: "批准重审：维持原批准 phase-04/reapproval@vN"
reapproval_decision_matrix:
  reapprove:
    required_command: "批准重审：批准 phase-04/reapproval@vN"
    required_new_phase: none
    downstream_execution_allowed_after_approval: true
  revise_design:
    required_command: "批准重审：重做设计 phase-04/reapproval@vN"
    required_new_phase: phase-02
    downstream_execution_allowed_after_approval: false
  revise_blueprint:
    required_command: "批准重审：重做蓝图 phase-04/reapproval@vN"
    required_new_phase: phase-03
    downstream_execution_allowed_after_approval: false
  revise_handoff:
    required_command: "批准重审：重做交接 phase-04/reapproval@vN"
    required_new_phase: phase-05
    downstream_execution_allowed_after_approval: false
  block_execution:
    required_command: "批准重审：阻断执行 phase-04/reapproval@vN"
    required_new_phase: none
    downstream_execution_allowed_after_approval: false
  no_change:
    required_command: "批准重审：维持原批准 phase-04/reapproval@vN"
    required_new_phase: none
    downstream_execution_allowed_after_approval: true
